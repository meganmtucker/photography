  <style>
    /* Password overlay */
    #login-overlay {
      position: fixed;
      top:0; left:0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }
    #login-overlay input {
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      width: 200px;
    }
    #login-overlay button {
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      background: #303030;
      color: #E6E6E6;
      cursor: pointer;
      font-weight: bold;
    }
    #login-overlay button:hover {
      background: #505050;
    }
    .download-btn {
      display: inline-block;
      margin: 20px 0;
      padding: 12px 24px;
      background: #303030;
      color: #E6E6E6;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.3s;
    }
    .download-btn:hover {
      background: #505050;
    }
  </style>
</head>
<body>
  
  
  <!-- Password Overlay -->
  <div id="login-overlay">
    <h2>Enter Password to Access Gallery</h2>
    <input type="password" id="pw" placeholder="Password">
    <button onclick="checkPassword()">Enter</button>
  </div>

  <!-- Gallery Content -->
  <div id="gallery" style="display:none;">
    <h1 style="text-align:center; margin-top:20px;">Shoot Highlights</h1>

    <!-- Masonry Grid -->
    <div class="masonry">
      <!-- Example highlights -->
      <div class="masonry-item"><img src="jpgs/asiaboat44.jpg" alt="Photo 1"></div>
      <div class="masonry-item"><img src="jpgs/asiaboat44.jpg" alt="Photo 2"></div>
      <div class="masonry-item"><img src="jpgs/asiaboat44.jpg" alt="Photo 3"></div>
      <div class="masonry-item"><img src="jpgs/asiaboat44.jpg" alt="Photo 4"></div>
      <div class="masonry-item"><img src="jpgs/asiaboat44.jpg" alt="Photo 5"></div>
      <!-- Add up to ~20 highlights -->
    </div>

    <!-- Download All -->
    <div style="text-align:center;">
      <a class="download-btn" href="full-album.zip" download>Download All Photos</a>
    </div>
  </div>

  <script>
    const correctPassword = "pass"; // Change per shoot

    function checkPassword() {
      const input = document.getElementById("pw").value;
      if(input === correctPassword){
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("gallery").style.display = "block";
      } else {
        alert("Incorrect password");
      }
    }
  </script>
</body>
